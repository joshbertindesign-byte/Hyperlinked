<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Spin-dle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet museum gallery, curious and calm
   IDEA: an object on a plinth under a spotlight, slowly revealed
   PICTURE: the 3D object itself, filling most of the screen
   COLOUR and TYPE: warm gallery paper and ink, gold accent; Crimson Pro titles + system sans
   LAYOUT: one screen: slim header, big viewer, view pips, a guess box */
:root{color-scheme:light dark;
  --bg:light-dark(#f4f1ea,#121315);--card:light-dark(#fffdf8,#1c1e21);--ink:light-dark(#1d1f22,#e8eaed);
  --mute:light-dark(#62605a,#a3a29c);--rule:light-dark(#d6d0c4,#3a3c40);--acc:light-dark(#9a6b12,#e0b257);
  --good:light-dark(#1d7a5c,#45c08f);--bad:light-dark(#c23b30,#ff8277);--plinth:light-dark(#ebe5d8,#191b1e)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.app{height:100dvh;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--rule);flex:none}
.brand b{display:block;font:600 26px/1 "Crimson Pro",Georgia,serif}
.brand span{font-size:12px;color:var(--mute)}
.seg{display:flex;border:1px solid var(--acc);border-radius:999px;overflow:hidden}
.seg button{min-height:40px;padding:0 14px;font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--acc);cursor:pointer}
.seg button.on{background:var(--acc);color:var(--card)}
.view{position:relative;flex:1;min-height:150px;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--card),var(--plinth) 75%);border:1px solid var(--rule)}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mute);font-size:14px;text-align:center;padding:20px;pointer-events:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);animation:hop .9s ease-in-out infinite;flex:none}
@keyframes hop{50%{transform:translateY(-8px);opacity:.5}}
.tag{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--mute);background:color-mix(in srgb,var(--card) 80%,transparent);padding:3px 8px;border-radius:999px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.pips{display:flex;gap:6px}
.pip{width:26px;height:8px;border-radius:4px;background:var(--rule)}
.pip.on{background:var(--acc)}.pip.miss{background:var(--bad)}.pip.win{background:var(--good)}
.cap{font-size:13px;color:var(--mute);margin:0;text-align:right}
.guess{display:flex;gap:8px;flex:none}
.guess input{flex:1;min-height:48px;padding:0 14px;font:16px/1 inherit;font-family:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:8px}
.guess input:focus{outline:3px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.tries{display:flex;flex-wrap:wrap;gap:6px;flex:none}
.tries:empty{display:none}
.try{font-size:13px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 45%,var(--rule));color:var(--mute);text-decoration:line-through}
.try.skip{text-decoration:none;background:var(--card);border-color:var(--rule)}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:none}
.btn{min-height:46px;padding:0 18px;font:inherit;font-size:15px;font-weight:600;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--card);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.result{display:flex;flex-direction:column;gap:8px;flex:none}
.result h2{font:600 26px/1.1 "Crimson Pro",Georgia,serif;margin:0}
.verdict{font-weight:700;margin:0}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.fact{margin:0;font-size:14px;color:var(--mute)}
.fact a{color:var(--acc)}
pre.share{margin:0;padding:8px 10px;background:var(--card);border:1px solid var(--rule);border-radius:6px;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.credit{font-size:11px;color:var(--mute);text-align:center;margin:0;flex:none}
.credit a{color:inherit}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:999px;font-weight:600;font-size:15px;color:#fff;background:var(--bad);box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@media(max-height:640px){.brand b{font-size:22px}.credit,pre.share{display:none}.view{min-height:120px}.result h2{font-size:22px}.fact{font-size:13px}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js">
<link rel="preconnect" href="https://3d-api.si.edu" crossorigin>
<script>
// Starts downloading the object list, then today's object, in parallel with the 3D library.
window.SPIN=(()=>{
  const API='https://3d-api.si.edu/content/document/', LO=['Thumb','Low','Medium'], cache=new Map();
  const pick=(m,qs)=>{const ds=(m.derivatives||[]).filter(d=>d.usage==='Web3D');for(const q of qs){const d=ds.find(x=>x.quality===q);const a=d&&(d.assets||[]).find(a=>a.type==='Model'||/\.glb$/i.test(a.uri||''));if(a)return a.uri}return null};
  // Some objects use a "3d_package:" id and some don't, so ask for both at once.
  const docOf=id=>Promise.any(['3d_package:'+id,id].map(p=>fetch(API+p+'/document.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json().then(doc=>({base:API+p+'/',doc}))})));
  function prefetch(id){
    if(cache.has(id))return cache.get(id);
    const docP=docOf(id);
    const loP=docP.then(({base,doc})=>Promise.all((doc.models||[]).map(m=>{const u=pick(m,LO);return u?fetch(base+encodeURI(u)).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()}):null})));
    docP.catch(()=>cache.delete(id));loP.catch(()=>{});
    const e={docP,loP};cache.set(id,e);return e;
  }
  const today=new Date().toLocaleDateString('en-CA');
  const hash=s=>{let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
  // Today's daily: the object scheduled for today, or a repeat chosen by the date if the queue has run out.
  const dailyOf=list=>list.find(o=>o.day===today)||list[hash('spin|'+today)%list.length];
  const listP=fetch('objects.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{const l=d.objects||[];if(l.length)prefetch(dailyOf(l).id);return l});
  return {pick,docOf,prefetch,today,hash,dailyOf,listP};
})();
</script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>Spin-dle</b><span id="sub">Name the Smithsonian object</span></div>
    <div class="seg" role="tablist"><button id="tDaily" class="on" role="tab">Daily</button><button id="tFree" role="tab">Free play</button></div>
  </header>
  <div class="view"><canvas id="cv" aria-label="3D view of the mystery object"></canvas><div class="status" id="status"><div class="dot" id="dot"></div><span id="statusTxt">Loading from the Smithsonian…</span></div><span class="tag" id="tag" hidden></span></div>
  <div class="bar"><div class="pips" id="pips"></div><p class="cap" id="cap"></p></div>
  <div class="tries" id="tries"></div>
  <form class="guess" id="gform" hidden><input id="g" type="text" placeholder="What is it?" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Your guess"><button class="btn" type="submit">Guess</button></form>
  <div class="row" id="moreRow" hidden><button class="btn ghost" id="more" type="button">Show me more (−1 point)</button></div>
  <div id="result" hidden></div>
  <p class="credit">3D scans: <a href="https://3d.si.edu/cc0" target="_blank" rel="noopener">Smithsonian Open Access</a> (CC0).</p>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module">
import {Viewer} from './viewer.js';
import {match} from './match.js';

const STAGES=['Silhouette, end-on','Silhouette, side-on','Shape, turning','Full colour','Spin it yourself'];
const POINTS=[5,4,3,2,1];
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const today=SPIN.today;
const prettyDay=new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const viewer=new Viewer($('cv'));
const dark=matchMedia('(prefers-color-scheme: dark)');
viewer.setDark(dark.matches);dark.addEventListener?.('change',e=>viewer.setDark(e.matches));

let OBJECTS=[],mode='daily',obj=null,stage=0,done=false,marks=[],tries=[],gen=0,freeOrder=[],freeIdx=0;

function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1500)}
function pips(){
  $('pips').innerHTML=STAGES.map((_,i)=>`<span class="pip${marks[i]==='win'?' win':marks[i]==='miss'?' miss':i<=stage?' on':''}"></span>`).join('');
  $('cap').textContent=done?'':`View ${stage+1} of 5 · ${STAGES[stage]}`;
}
function renderTries(){$('tries').innerHTML=tries.map(t=>`<span class="try${t.skip?' skip':''}">${t.skip?'Skipped':esc(t.text)}</span>`).join('')}
function playing(on){$('gform').hidden=!on;$('moreRow').hidden=!on;$('result').hidden=on}
function setStage(n){
  stage=n;viewer.setStage(n);
  $('tag').hidden=n<4;$('tag').textContent=obj.hint||'';
  $('more').disabled=n>=4;
  $('more').textContent=n>=4?'This is the last view':'Show me more (−1 point)';
  pips();
}
async function start(o,m){
  const my=++gen;mode=m;obj=o;stage=0;done=false;marks=[];tries=[];
  $('tDaily').classList.toggle('on',m==='daily');$('tFree').classList.toggle('on',m==='free');
  $('sub').textContent=m==='daily'?`Daily · ${prettyDay}`:'Free play';
  $('status').hidden=false;$('dot').hidden=false;$('statusTxt').textContent='Loading from the Smithsonian…';
  playing(false);$('result').hidden=true;$('tag').hidden=true;renderTries();pips();$('cap').textContent='';
  try{await viewer.load(o.id,o.view)}
  catch(e){
    if(my!==gen)return false;
    $('statusTxt').textContent='Couldn’t load this object from the Smithsonian. Check your connection, or try free play.';
    $('dot').hidden=true;return false;
  }
  if(my!==gen)return false;
  $('status').hidden=true;
  // Get the next free-play object downloading while this one is played.
  const nx=peekNext();if(nx)SPIN.prefetch(nx.id);
  return true;
}
async function begin(o,m){
  if(!await start(o,m))return;
  // Leaving a daily part-way still counts as today's try.
  if(m==='daily'){const d=store.get('spindle-daily');if(!d||d.date!==today)store.set('spindle-daily',{date:today,id:o.id,win:false,pts:0,share:`Spin-dle ${prettyDay}\nLeft early`})}
  playing(true);setStage(0);$('g').value='';
}
function submitGuess(text){
  if(done||!obj)return;
  const t=text.trim();
  if(!t)return;
  if(match(t,[obj.name,...(obj.aliases||[])])){marks[stage]='win';return finish(true)}
  marks[stage]='miss';tries.push({text:t});renderTries();
  $('g').value='';
  if(stage>=4)return finish(false);
  toast(`Not "${t}"`);setStage(stage+1);
}
$('gform').onsubmit=e=>{e.preventDefault();submitGuess($('g').value)};
$('more').onclick=()=>{if(!done&&stage<4){marks[stage]='skip';tries.push({skip:true});renderTries();setStage(stage+1)}};
function shareText(win){
  const row=STAGES.map((_,i)=>marks[i]==='win'?'🟩':marks[i]==='miss'?'🟥':marks[i]==='skip'?'⬜':'⬛').join('');
  return `Spin-dle ${prettyDay}\n${row} ${win?POINTS[stage]:0}/5`;
}
function showResult(o,{verdict,ok,share,next}){
  viewer.setStage(4);$('tag').hidden=false;$('tag').textContent=o.hint||'';
  playing(false);$('cap').textContent='';
  $('result').innerHTML=`<div class="result">
    <p class="verdict ${ok?'ok':'no'}">${esc(verdict)}</p>
    <h2>${esc(o.name)}</h2>
    <p class="fact">${esc(o.fact||'')} Drag to spin it. <a href="https://3d.si.edu/object/3d/${o.id}" target="_blank" rel="noopener">See it at the Smithsonian</a></p>
    ${share?`<pre class="share" id="shareTxt">${esc(share)}</pre>`:''}
    <div class="row">${share?'<button class="btn" id="copy">Copy result</button>':''}<button class="btn${share?' ghost':''}" id="next">${esc(next)}</button></div>
  </div>`;
  $('result').hidden=false;
  $('next').onclick=nextFree;
  if($('copy'))$('copy').onclick=async()=>{
    try{await navigator.clipboard.writeText(share);$('copy').textContent='Copied!'}
    catch(e){const r=document.createRange();r.selectNodeContents($('shareTxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('copy').textContent='Selected, press Ctrl+C'}
  };
}
function finish(win){
  done=true;$('g').blur();
  const pts=win?POINTS[stage]:0, share=shareText(win);
  if(mode==='daily')store.set('spindle-daily',{date:today,id:obj.id,win,pts,share});
  pips();
  showResult(obj,{ok:win,verdict:win?`Got it on view ${stage+1}: ${pts} point${pts===1?'':'s'}`:'Out of views',share:mode==='daily'?share:'',next:mode==='daily'?'Free play':'Next object'});
}
// Free play uses past dailies and free-play-only objects, so it never spoils an upcoming daily.
function freePool(){
  const d=SPIN.dailyOf(OBJECTS);
  const p=OBJECTS.filter(o=>o!==d&&(!o.day||o.day<today));
  return p.length>=3?p:OBJECTS.filter(o=>o!==d);
}
function peekNext(){
  if(freeIdx>=freeOrder.length){freeOrder=shuffle(freePool().filter(o=>o!==obj));freeIdx=0}
  return freeOrder[freeIdx];
}
function nextFree(){const o=peekNext();if(!o)return;freeIdx++;begin(o,'free')}
async function openDaily(){
  const o=SPIN.dailyOf(OBJECTS), d=store.get('spindle-daily');
  if(d&&d.date===today){
    // Already played today: show the object in full and the result.
    const shown=OBJECTS.find(x=>x.id===d.id)||o;
    if(!await start(shown,'daily'))return;
    stage=4;marks=[];pips();
    showResult(shown,{ok:d.win,verdict:`Today’s daily: ${d.pts}/5`,share:d.share,next:'Free play'});
    return;
  }
  begin(o,'daily');
}
$('tDaily').onclick=openDaily;
$('tFree').onclick=nextFree;
SPIN.listP.then(l=>{OBJECTS=l;openDaily()}).catch(()=>{$('statusTxt').textContent='Couldn’t load the object list.';$('dot').hidden=true});
</script>
</body>
</html>
